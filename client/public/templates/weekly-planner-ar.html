<!doctype html>
<html lang="ar" dir="rtl">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>المخطط الأسبوعي · Gapper</title>
<style>
  :root { --ink: #241e10; --line: #d8cfbf; --accent: #33491f; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f5ebd6; font-family: 'IBM Plex Sans Arabic', 'Segoe UI', Tahoma, sans-serif; color: var(--ink); }
  .bar { max-width: 297mm; margin: 16px auto 0; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; font-size: 14px; }
  .bar button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .page { width: 297mm; min-height: 210mm; margin: 12px auto 24px; background: #fff; padding: 12mm; box-shadow: 0 6px 30px rgba(0,0,0,.08); display: grid; gap: 8mm; grid-template-rows: auto auto 1fr; }
  h1 { margin: 0; font-family: 'Segoe UI', Tahoma, sans-serif; font-weight: 500; font-size: 24px; }
  .top { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6mm; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 30mm; }
  .box h2, .day h2 { margin: 0 0 4px; font-size: 12px; color: var(--accent); }
  .hint { margin: 0; font-size: 11px; color: #8a8a7c; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .day { padding: 8px; min-height: 100mm; background: repeating-linear-gradient(to bottom, transparent 0 7mm, #eee8dc 7mm calc(7mm + 1px)); }
  .day + .day { border-inline-start: 1px solid var(--line); }
  .day h2 { background: #fff; padding-bottom: 4px; }
  @media print { body { background: #fff; } .bar { display: none; } .page { margin: 0; box-shadow: none; } @page { size: A4 landscape; margin: 0; } }
  @media (max-width: 1150px) { .page { width: auto; margin: 12px; } .week { grid-template-columns: 1fr; } .day { min-height: 30mm; } .day + .day { border-inline-start: 0; border-top: 1px solid var(--line); } .top { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="bar"><strong>Gapper · المخطط الأسبوعي</strong><button onclick="window.print()">اطبع هذه الصفحة</button></div>
  <div class="page">
    <h1>أسبوع: ______________</h1>
    <div class="top">
      <div class="box"><h2>أهم 3 أولويات</h2><p class="hint">ما الذي يجب إنجازه هذا الأسبوع؟ المهم قبل العاجل.</p></div>
      <div class="box"><h2>مواعيد التسليم والامتحانات</h2><p class="hint">المساق · المهمة · الموعد</p></div>
      <div class="box"><h2>مراجعة يوم الجمعة</h2><p class="hint">ما الذي نجح؟ وماذا ستغيّر الأسبوع القادم؟</p></div>
    </div>
    <div class="week">
      <div class="day"><h2>الأحد</h2></div>
      <div class="day"><h2>الإثنين</h2></div>
      <div class="day"><h2>الثلاثاء</h2></div>
      <div class="day"><h2>الأربعاء</h2></div>
      <div class="day"><h2>الخميس</h2></div>
      <div class="day"><h2>الجمعة</h2></div>
      <div class="day"><h2>السبت</h2></div>
    </div>
  </div>
</body>
</html>
