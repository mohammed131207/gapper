<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>Weekly Planner · Gapper</title>
<style>
  :root { --ink: #2a2d24; --line: #d8cfbf; --accent: #4f6443; --soft: #eef1e7; }
  * { box-sizing: border-box; }
  body { margin: 0; background: #f3efe7; font-family: system-ui, -apple-system, 'Segoe UI', sans-serif; color: var(--ink); }
  .bar { max-width: 297mm; margin: 16px auto 0; display: flex; justify-content: space-between; align-items: center; padding: 0 4px; font-size: 14px; }
  .bar button { background: var(--accent); color: #fff; border: 0; border-radius: 999px; padding: 9px 18px; font: inherit; font-weight: 600; cursor: pointer; }
  .page { width: 297mm; min-height: 210mm; margin: 12px auto 24px; background: #fff; padding: 12mm; box-shadow: 0 6px 30px rgba(0,0,0,.08); display: grid; gap: 8mm; grid-template-rows: auto auto 1fr; }
  h1 { margin: 0; font-family: Georgia, serif; font-weight: 500; font-size: 24px; }
  .top { display: grid; grid-template-columns: 2fr 1fr 1fr; gap: 6mm; }
  .box { border: 1px solid var(--line); border-radius: 8px; padding: 8px 10px; min-height: 30mm; }
  .box h2, .day h2 { margin: 0 0 4px; font-size: 11px; text-transform: uppercase; letter-spacing: .08em; color: var(--accent); }
  .hint { margin: 0; font-size: 10.5px; color: #8a8a7c; }
  .week { display: grid; grid-template-columns: repeat(7, 1fr); border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
  .day { padding: 8px; min-height: 100mm; background: repeating-linear-gradient(to bottom, transparent 0 7mm, #eee8dc 7mm calc(7mm + 1px)); }
  .day + .day { border-left: 1px solid var(--line); }
  .day h2 { background: #fff; padding-bottom: 4px; }
  @media print { body { background: #fff; } .bar { display: none; } .page { margin: 0; box-shadow: none; } @page { size: A4 landscape; margin: 0; } }
  @media (max-width: 1150px) { .page { width: auto; margin: 12px; } .week { grid-template-columns: 1fr; } .day { min-height: 30mm; } .day + .day { border-left: 0; border-top: 1px solid var(--line); } .top { grid-template-columns: 1fr; } }
</style>
</head>
<body>
  <div class="bar"><strong>Gapper · Weekly Planner</strong><button onclick="window.print()">Print this page</button></div>
  <div class="page">
    <h1>Week of ______________</h1>
    <div class="top">
      <div class="box"><h2>Top 3 priorities</h2><p class="hint">What must get done this week? Important before urgent.</p></div>
      <div class="box"><h2>Deadlines &amp; exams</h2><p class="hint">Course · task · due date</p></div>
      <div class="box"><h2>Friday review</h2><p class="hint">What worked? What will you change next week?</p></div>
    </div>
    <div class="week">
      <div class="day"><h2>Sunday</h2></div>
      <div class="day"><h2>Monday</h2></div>
      <div class="day"><h2>Tuesday</h2></div>
      <div class="day"><h2>Wednesday</h2></div>
      <div class="day"><h2>Thursday</h2></div>
      <div class="day"><h2>Friday</h2></div>
      <div class="day"><h2>Saturday</h2></div>
    </div>
  </div>
</body>
</html>
